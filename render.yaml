services:
  - type: web
    name: diamondsuitescrystalriver
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: PORT
        value: "4100"
      - key: ALLOWED_ORIGINS
        value: https://diamondsuitescrystalriver.com,https://www.diamondsuitescrystalriver.com
      - key: INQUIRY_RECIPIENT_EMAIL
        value: ashley@diamondsuitesocala.com
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: GRAPH_SENDER_EMAIL
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
