name: Deploy client to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  VITE_API_URL: ${{ vars.VITE_API_URL || '' }}

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use stable npm version
        run: npm install --global npm@10.8.0 --no-audit --no-fund

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Reset npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund --prefer-online
        timeout-minutes: 15

      - name: Type-check client
        run: npm run typecheck --workspace client --if-present

      - name: Build client
        run: npm run build --workspace client

      - name: Add SPA fallback
        run: cp client/dist/index.html client/dist/404.html

      - name: Disable Jekyll
        run: touch client/dist/.nojekyll

      - name: Verify build output
        run: |
          test -f client/dist/index.html
          test -f client/dist/404.html
          test -f client/dist/.nojekyll
          test -d client/dist/assets
          echo "GitHub Pages build is ready."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

      - name: Save npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: /home/runner/.npm/_logs/
          if-no-files-found: ignore
          retention-days: 5

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4