name: Deploy client to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  VITE_API_URL: ${{ vars.VITE_API_URL }}

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Configure npm
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 15

      - name: Type-check client
        run: npm run typecheck --workspace client --if-present

      - name: Build client
        run: npm run build --workspace client

      - name: Add SPA fallback
        run: cp client/dist/index.html client/dist/404.html

      - name: Add custom domain
        run: echo "diamondsuitescrystalriver.com" > client/dist/CNAME

      - name: Disable Jekyll
        run: touch client/dist/.nojekyll

      - name: Verify build
        run: |
          test -f client/dist/index.html
          test -f client/dist/404.html
          test -f client/dist/CNAME
          echo "Build files found successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4