name: Deploy client to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  VITE_API_URL: ${{ vars.VITE_API_URL }}

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Type-check client
        run: npm run typecheck --workspace client --if-present

      - name: Build client
        run: npm run build --workspace client

      - name: Add custom domain
        run: echo "diamondsuitescrystalriver.com" > client/dist/CNAME

      - name: Add React SPA fallback
        run: cp client/dist/index.html client/dist/404.html

      - name: Verify build output
        run: |
          test -f client/dist/index.html
          test -f client/dist/404.html
          test -f client/dist/CNAME
          echo "Client build is ready for deployment."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist

  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5